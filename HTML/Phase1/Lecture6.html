<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture 4: example</title>
</head>

<body>

    <h1>University Registration Form</h1>
    <p>Please fill out the form below to register</p>
    <hr>

    <form action="" method="post" enctype="multipart/form-data">

        <h3>Personal Details</h3>

        <label for="first_name">First Name:</label>
        <input type="text" id="first_name" name="firstName" placeholder="enter your first name" required>
        <br><br>

        <label for="last_name">Second Name:</label>
        <input type="text" id="last_name" name="lastName" placeholder="enter your last name">
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" placeholder="dd/mm/yyyy">
        <br><br>

        <h3>Gender</h3>

        <label for="male">Male</label>
        <input type="radio" id="male" name="gender" value="male">
        <br><br>

        <label for="female">Female</label>
        <input type="radio" id="female" name="gender" value="female">
        <br><br>

        <label for="other">Other</label>
        <input type="radio" id="other" name="gender" value="other">
        <br><br>

        <label for="profile">Upload Your Photo:</label>
        <input type="file" name="profile" id="profile">
        <br><br>

        <hr>

        <h3>Contact Details</h3>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="you@example.com">

        <br><br>

        <label for="phone_number">Phone Number:</label>
        <input type="tel" id="phone_number" name="phone_number" placeholder="e.g.,8768754098" pattern="^[0-9]{10}$"
            required>

        <br><br>

        <label for="address">Mailing Address:</label>

        <br><br>

        <textarea name="address" id="address" rows="10" cols="30"
            placeholder="Street Address, City, State, ZIP Code"></textarea>

        <br><br>

        <hr>

        <h3>Additional Information</h3>

        <label for="course">Select Your Course:</label>

        <br><br>

        <select name="course" id="course">
            <option value="">--Choice a course--</option>
            <option value="sports">Sports</option>
            <option value="music_art">Music & Art</option>
            <option value="technolgy_clubs">Technolgy Clubs</option>
            <option value="volunteering">Volunteering</option>
        </select>

        <br><br>

        <label for="interest_workout">Workout</label>
        <input type="checkbox" id="interest_workout" value="workout" name="interest">
        <br><br>

        <label for="interest_running">Running</label>
        <input type="checkbox" id="interest_running" value="running" name="interest">
        <br><br>

        <label for="interest_coding">Coding</label>
        <input type="checkbox" id="interest_coding" value="coding" name="interest">
        <br><br>

        <hr>

        <h3>Create Your Account</h3>

        <label for="update_password">Change password:</label>
        <input type="password" id="update_password" name="update_password">

        <br><br>

        <label for="security_question">Security Question:</label>

        <select name="security_question" id="security_question">
            <option value="">--Choice Any Question--</option>
            <option value="pet_name">What is your pet name?</option>
            <option value="teacher_name">What is your teacher name?</option>
        </select>

        <br><br>

        <label for="security_answer">Security Answer:</label>
        <input type="text" id="security_answer" name="security_answer">

        <br><br>

        <input type="checkbox" id="terms_condition" name="terms_condition">
        <label for="terms_condition">I agree to the Terms and Condition</label>

        <hr>

        <button type="submit" name="submit_button">Register</button>
        <button type="reset" name="reset_button">Clear Form</button>

    </form>

</body>

</html>
