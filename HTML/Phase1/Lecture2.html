<!-- 2. Why do we give a class name?

Suppose you have 3 paragraphs:

<p>First paragraph</p>
<p>Second paragraph</p>
<p>Third paragraph</p>

Now you want all three paragraphs to be red. You can give them the same class:

<p class="red-text">First paragraph</p>
<p class="red-text">Second paragraph</p>
<p class="red-text">Third paragraph</p>

Then CSS can say:

.red-text {
    color: red;
}

Now the browser understands: Find all elements having the class red-text and make their text red.
So the class acts as a way to identify/group elements. -->
