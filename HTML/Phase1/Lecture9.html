<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <form action="" method="post">
    <table cellspacing="8" cellpadding="3" border="0">
        <tr>
            <td><label for="name">Name:</label></td>
            <td><input type="text" id="name" name="name" required placeholder="John Doe"></td>
        </tr>
        <tr>
            <td><label for="email">Email:</label></td>
            <td><input type="email" id="email" name="email" required placeholder="john@example.com"></td>
        </tr>
        <tr>
            <td valign="top"><label for="message">Message:</label></td>
            <td><textarea id="message" name="message" rows="4" cols="30"
                    placeholder="Type your message here..."></textarea></td>
        </tr>
        <tr>
            <td></td>
            <td><input type="submit" value="Submit Message"></td>
        </tr>
    </table>
</form>
</body>
</html>
