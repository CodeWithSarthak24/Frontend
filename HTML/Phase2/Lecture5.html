<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colgroup</title>
</head>

<body>

    <table border="4">

        <thead>
            <tr>
                <th scope="colgroup" colspan="4">
                    Exam
                </th>
            </tr>

            <tr>
                <th scope="colgroup" colspan="2">
                    Written
                </th>
                <th scope="colgroup" colspan="2">
                    Practical
                </th>
            </tr>

            <tr>
                <th scope="col">Math</th>
                <th scope="col">Science</th>
                <th scope="col">Math</th>
                <th scope="col">Science</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>79</td>
                <td>85</td>
                <td>90</td>
                <td>88</td>
            </tr>
        </tbody>

    </table>

</body>

</html>
