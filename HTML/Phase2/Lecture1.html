<!-- 2. Why we use an id instead of a class?

An id is a unique identifier. In HTML, a specific id name can only be used once per page (like a fingerprint or a passport number).
If we used a class, there could be 5 different elements with that same class name. 
The browser would get confused about which one you wanted to jump to.
Because an id is unique, the browser knows exactly which single element to target.

{When you click the button, the browser instantly searches for the element with that matching id. 
Once it finds it, it automatically slides or jumps the page
so that specific section is displayed right in front of the user's eyes on the screen.} -->
