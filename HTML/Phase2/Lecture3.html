<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>

<body>

    <h2 style="color: darkred">My Java Full Stack Roadmap</h2>

    <!-- Unordered List -->

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <!-- Ordered List -->

    <ol>
        <li>CORE JAVA</li>
        <li>JDBC</li>
        <li>Spring BOOT</li>
    </ol>

    <!-- Nested List -->

    <ol>

        <!-- Main Item 1: Frontend -->
        <li>
            Frontend Technology
            <ol>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
            </ol>

        </li>

        <!-- Main Item 2: Backend -->
        <li>
            Backend Technology
            <ol>
                <li>JAVA</li>
                <li>JDBC</li>
                <li>Spring BOOT</li>
            </ol>
        </li>

    </ol>

    <!-- Descriptive List -->

    <dl>
        <dt>HTML:</dt>
        <dd>HyperText Markup Language</dd>
    </dl>

</body>

</html>
