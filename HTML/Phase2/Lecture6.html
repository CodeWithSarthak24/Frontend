<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rowgroup</title>
</head>

<body>

    <table border="3">

        <thead>

            <tr>
                <th scope="col">
                    Class
                </th>
                <th scope="col">
                    Student
                </th>
                <th scope="col">
                    Math
                </th>
                <th scope="col">
                    English
                </th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <th scope="rowgroup" rowspan="2">
                    CLASS 10
                </th>
                <th scope="row">
                    Rahul
                </th>
                <td>
                    78
                </td>
                <td>
                    80
                </td>
            </tr>

            <tr>
                <th scope="row">
                    Sarthak
                </th>
                <td>
                    98
                </td>
                <td>
                    80
                </td>
            </tr>

            <tr>
                <th scope="rowgroup" rowspan="2">
                    CLASS 12
                </th>
                <th scope="row">
                    Rahul
                </th>
                <td>
                    78
                </td>
                <td>
                    80
                </td>
            </tr>

            <tr>
                <th scope="row">
                    Sarthak
                </th>
                <td>
                    98
                </td>
                <td>
                    80
                </td>
            </tr>

        </tbody>

    </table>

</body>

</html>
