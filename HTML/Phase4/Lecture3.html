<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Forms with validation</title>
</head>

<body>

    <form>

        <h2 style="text-align: center;"><i>Student Registration Form</i></h2>

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" min="3" max="50" required><br><br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="8" required><br><br>

        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="18" max="60"><br><br>

        <label for="salary">Salary</label>
        <input type="range" id="salary" name="salary" min="1000" max="10000" step="500"><br><br>

        <label for="pincode">PIN Code</label>
        <input type="number" id="pincode" name="pincode" pattern="[0-9]{6}"><br><br>

        <input type="checkbox" id="terms&condition" name="terms&condition" required>
        <label for="terms&condition">Terms & Conditions</label><br><br>

        <button type="submit">Submit</button>

    </form>

</body>

</html>
