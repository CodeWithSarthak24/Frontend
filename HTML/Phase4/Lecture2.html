<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Element</title>
</head>

<body>

    <h2 style="text-align: center;">Job Application Form</h2>

    <h3><b>Personal Information</b></h3>


    <form action="" method="post">

        <label for="name">Name</label>
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="password">Password</label>
        <input type="password" id="password" name="password"><br><br>

        <label for="age">Age</label>
        <input type="number" id="age" name="age"><br><br>

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob"><br><br>

        <h3><b>Experience</b></h3>

        <!-- 1. Fresher Option -->
        <input type="radio" id="exp-fresher" name="experience" value="fresher">
        <label for="exp-fresher">Fresher</label><br><br>

        <input type="radio" id="exp-mid" name="experience" value="1 to 2 Years">
        <label for="exp-mid">1 to 2 Years</label><br><br>

        <input type="radio" id="exp-senior" name="experience" value="3+ Years">
        <label for="exp-senior">3+ Years</label><br><br>

        <h3><b>Skills</b></h3>

        <input type="checkbox" id="skill-java" name="skill" value="java">
        <label for="skill-java">Java</label><br><br>

        <input type="checkbox" id="skill-springboot" name="skill" value="springboot">
        <label for="skill-springboot">Spring Boot</label><br><br>

        <input type="checkbox" id="skill-mysql" name="skill" value="mysql">
        <label for="skill-mysql">MySQL</label><br><br>

        <input type="checkbox" id="skill-mongodb" name="skill" value="mongodb">
        <label for="skill-mongodb">Redis</label><br><br>

        <button type="submit">Submit</button>

    </form>

</body>

</html>
