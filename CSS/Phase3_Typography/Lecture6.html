<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Styles6.css">
</head>

<body>

    <div id="outer-design">

        <h1>Login Form</h1>

        <div id="inner-design">

            <label for="email"  class="label">User Email:</label>
            <input type="email" id="email" class="input" placeholder="Enter your email" name="email">

            <label for="password"  class="label">User Password:</label>
            <input type="password" id="password" class="input" placeholder="Enter your password" name="password">

            <button type="submit" class="btn">Login</button>

            <span>Not registered?</span>

            <button type="submit" class="btn">Create an Account</button>

        </div>

    </div>

</body>

</html>
