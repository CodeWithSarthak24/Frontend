<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Units</title>
    <link rel="stylesheet" href="Style3.css">
</head>

<body>

    CODING

    <!-- px units -->
    <div id="i1">Hello</div><br>

    <!-- % units -->
    <div id="i2">
        Welcome
        <div id="i3">
            Bye
        </div>
    </div><br>

    <div id="box1">
        <div id="box2">box2</div>
    </div><br><br>

    <!-- em units -->
    <div id="box3">Box 3
        <div id="box4">Box 4</div>
    </div><br><br>

    <!-- rem units -->
    <div id="box5">Box 5</div><br>

    <!-- vw — Viewport Width -->
    <div id="j">Java</div>

    <!-- vh — Viewport Height  -->
     <div id="s">Spring boot</div>

</body>

</html>
